<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件整理助手 v2.0 - UI 预览</title>
<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --line:#e3e8f0; --text:#1f2937; --muted:#6b7280;
  --primary:#2563eb; --primary-h:#1d4ed8; --primary-bg:#eff6ff; --primary-line:#bfdbfe;
  --danger:#dc2626; --danger-bg:#fef2f2; --danger-line:#fecaca;
  --ok:#16a34a; --ok-bg:#f0fdf4; --ok-line:#bbf7d0;
  --radius:12px; --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 16px rgba(15,23,42,.06);
  --tab-h:46px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}

/* ===== 顶部 ===== */
.app{max-width:1080px;margin:0 auto;padding:20px 20px 48px}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:38px;height:38px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.brand .logo svg{width:100%;height:100%;display:block}
.brand .title{font-size:17px;font-weight:700}
.brand .ver{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:1px 8px}

/* ===== 标签页 ===== */
.tabs{display:flex;background:#e2e8f0;border-radius:999px;padding:4px;gap:4px}
.tab{border:none;background:transparent;color:#475569;padding:8px 18px;border-radius:999px;font-size:13.5px;font-weight:600;transition:background .15s,color .15s}
.tab:hover:not(:disabled){background:#f1f5f9}
.tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.tab:disabled{color:#94a3b8;cursor:not-allowed;opacity:.7}
.tab .lock{font-size:11px;margin-left:4px;opacity:.7}
.panel{display:none}
.panel.active{display:block}

/* ===== 卡片 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card.toolbar-card{overflow:visible}
.card-hd{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:14.5px}
.card-hd .dot{width:8px;height:8px;border-radius:2px;background:var(--primary)}
.card-bd{padding:18px 20px}

/* ===== 表单 ===== */
.field{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field .lbl{width:96px;text-align:right;color:#475569;font-size:13.5px;flex:none}
.textbox{flex:1;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:13.5px;outline:none;transition:border-color .15s,box-shadow .15s;background:#fff;color:var(--text)}
.textbox:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 14px;font-size:13px;color:#374151;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:#cbd5e1;background:#f8fafc}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;box-shadow:0 2px 6px rgba(37,99,235,.3)}
.btn.primary:hover{background:var(--primary-h)}
.btn.primary:disabled{background:#93c5fd;border-color:#93c5fd;cursor:not-allowed;box-shadow:none}
.btn.danger{background:#fff;border-color:var(--danger-line);color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13.5px}
.check input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}

/* 导出设置显隐 */
#exportArea{overflow:hidden;transition:max-height .25s ease,opacity .25s ease;max-height:160px;opacity:1}
#exportArea.hidden{max-height:0;opacity:0}

/* ===== 开始按钮与进度 ===== */
.start-wrap{text-align:center;padding:6px 0 14px}
.btn-start{height:44px;padding:0 44px;font-size:15px;border-radius:10px;border:none;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(37,99,235,.35);transition:transform .1s,box-shadow .15s,opacity .15s}
.btn-start:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,99,235,.4)}
.btn-start:disabled{opacity:.55;cursor:not-allowed;transform:none}
.progress-wrap{margin-top:6px}
.progress-track{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#2563eb,#60a5fa);border-radius:999px;transition:width .12s linear}
.progress-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted);gap:12px;flex-wrap:wrap}
.progress-meta .pct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.scan-status{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scan-done{margin-top:12px;padding:10px 14px;background:var(--ok-bg);border:1px solid var(--ok-line);color:#14532d;border-radius:10px;font-size:13px;display:none}

/* ===== 结果页工具栏 ===== */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px}
.search-wrap{position:relative;flex:1 1 220px;min-width:200px}
.search-wrap .search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:#94a3b8}
.search-wrap input{padding-left:30px;width:100%}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;color:#94a3b8;cursor:pointer;font-size:14px;line-height:1;padding:2px;display:none}
.search-clear:hover{color:var(--danger)}
.dropdown{position:relative}
.dropdown .btn{display:inline-flex;align-items:center;gap:6px}
.dropdown .caret{font-size:10px;color:#94a3b8}
.dropdown .btn.active{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.btn.has-filter .btn-label{color:var(--primary);font-weight:600}
.drop-panel{position:absolute;top:calc(100% + 6px);left:0;min-width:280px;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.18);z-index:50;display:none;overflow:hidden}
.drop-panel.open{display:block}
.drop-panel .dp-hd{padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.drop-panel .dp-hd .clear-link{color:var(--primary);cursor:pointer;font-size:12px}
.drop-panel .dp-body{max-height:300px;overflow:auto;padding:6px}
.drop-panel .dp-ft{padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.toolbar .spacer{flex:1}
.batch-ops{display:flex;gap:8px}

/* 树 */
.tree-search{margin:0;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.tree-search input{flex:1}
.tree-box{max-height:280px;overflow:auto;padding:6px 8px}
.tree-node{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:13px;white-space:nowrap}
.tree-node:hover{background:#f1f5f9}
.tree-node .folder-ico{font-size:12px}
.tree-node .cnt{color:var(--muted);font-size:11.5px;margin-left:auto;padding-left:8px}
.tree-node input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;flex:none}
.tree-node .nm{overflow:hidden;text-overflow:ellipsis}
.tree-node.hidden{display:none}

/* 格式多选 */
.fmt-list{max-height:280px;overflow:auto;padding:8px 12px}
.fmt-item{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:13px}
.fmt-item:hover{background:#f1f5f9}
.fmt-item input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
.fmt-item .cnt{color:var(--muted);font-size:11.5px;margin-left:auto}

/* 大小档位 */
.tier-list{padding:8px 12px}
.tier-item{display:flex;align-items:center;gap:8px;padding:6px;border-radius:7px;cursor:pointer;font-size:13px}
.tier-item:hover{background:#f1f5f9}
.tier-item input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}

/* ===== 表格 ===== */
.table-card{padding:0}
.grid-head,.grid-row{display:grid;grid-template-columns:44px minmax(180px,1.4fr) 100px minmax(260px,2fr) 110px;align-items:center}
.grid-head{height:40px;background:#f8fafc;border-bottom:1px solid var(--line);padding:0 12px;font-size:12.5px;color:#64748b;font-weight:600}
.grid-head .col-check{justify-self:center}
.col-sortable{display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;padding-right:8px}
.col-sortable:hover .sort-ico{color:var(--primary)}
.sort-ico{font-size:11px;color:#cbd5e1;font-style:normal;line-height:1}
.sort-ico.on{color:var(--primary);font-weight:700}
.grid-head input,.grid-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
.vlist{position:relative;height:430px;overflow:auto;background:#fff}
.vlist .spacer{position:absolute;top:0;left:0;right:0}
.vlist .rows{position:relative;height:100%}
.grid-row{position:absolute;left:0;right:0;height:34px;padding:0 12px;border-bottom:1px solid #f1f5f9;font-size:13px;color:#334155}
.grid-row:hover{background:#f8fafc}
.grid-row .col-check{justify-self:center}
.grid-row .cell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:10px}
.grid-row .cell.name{font-weight:500;color:#0f172a}
.grid-row .cell.ext{color:#64748b}
.grid-row .cell.path{color:var(--primary);cursor:pointer}
.grid-row .cell.path:hover{text-decoration:underline}
.grid-row .cell.size{color:#475569;font-variant-numeric:tabular-nums;text-align:right}
.grid-row.selected-row{background:var(--primary-bg)}

/* 底部统计 */
.table-ft{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.table-ft b{color:var(--text);font-variant-numeric:tabular-nums}
.table-ft .sel{color:var(--primary);font-weight:600}

/* 空态 */
.empty-state{padding:60px 20px;text-align:center;color:#94a3b8}
.empty-state .big{font-size:34px;margin-bottom:8px}

/* ===== 弹层 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100}
.modal-mask.open{display:flex}
.modal{width:420px;max-width:92vw;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.3);overflow:hidden}
.modal-hd{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.modal-hd .warn{font-size:17px}
.modal-bd{padding:16px 20px;font-size:13.5px;color:#475569;max-height:300px;overflow:auto}
.modal-bd .preview-list{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--text);background:#f8fafc}
.modal-bd .preview-list .row-item{padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.rule-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.rule-row label{width:64px;text-align:right;color:#475569;flex:none}
.rule-row .textbox{flex:1}
.modal-bd .check input[type=radio]{width:15px;height:15px;accent-color:var(--primary)}

/* toast */
.toast-zone{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(15,23,42,.3);animation:toastIn .2s ease;max-width:420px}
.toast.ok{background:#15803d}
.toast.warn{background:#b45309}
.toast.err{background:#b91c1c}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 预览提示条 */
.preview-note{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:1080px;margin:0 auto;background:#fefce8;border-top:1px solid #fde68a;color:#854d0e;font-size:12px;padding:8px 20px;text-align:center}
</style>
</head>

  <!-- ============ 标签一：扫描配置 ============ -->
  <section class="panel active" id="panel-scan">
    <div class="card">
      <div class="card-hd"><span class="dot"></span>扫描范围</div>
      <div class="card-bd">
        <div class="field">
          <span class="lbl">目标文件夹</span>
          <input class="textbox" id="txtFolder" placeholder="请输入或选择要扫描的文件夹，如 D:\资料">
          <button class="btn" id="btnBrowse">浏览文件夹</button>
        </div>
        <label class="check" style="margin-left:106px">
          <input type="checkbox" id="chkHidden"> 包含隐藏文件和文件夹
        </label>
      </div>
    </div>

    <div class="card">
      <div class="card-hd"><span class="dot"></span>导出设置</div>
      <div class="card-bd">
        <label class="check" style="margin-bottom:14px">
          <input type="checkbox" id="chkExport" checked> 导出 xlsx 文件（取消勾选则不生成 Excel）
        </label>
        <div id="exportArea">
          <div class="field">
            <span class="lbl">导出位置</span>
            <input class="textbox" id="txtExportPath" placeholder="请选择导出文件夹">
            <button class="btn" id="btnBrowseExport">浏览</button>
            <button class="btn" id="btnOpenOutput">打开文件夹</button>
          </div>
          <div class="field">
            <span class="lbl">导出文件名</span>
            <input class="textbox" id="txtFileName" value="文件名导出_20260803_153000.xlsx">
            <button class="btn" id="btnRefreshName" title="重新生成默认文件名">刷新</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-bd">
        <div class="start-wrap">
          <button class="btn-start" id="btnStart">开始扫描</button>
        </div>
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
          <div class="progress-meta">
            <span class="scan-status" id="scanStatus">等待开始……</span>
            <span class="pct" id="progPct">0%</span>
          </div>
          <div class="progress-meta" style="margin-top:2px">
            <span id="scanFileCount">已发现 0 个文件</span>
          </div>
        </div>
        <div class="scan-done" id="scanDone"></div>
      </div>
    </div>
  </section>

  <!-- ============ 标签二：扫描结果 ============ -->
  <section class="panel" id="panel-result">
    <div class="card toolbar-card">
      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-ico">&#128269;</span>
          <input class="textbox" id="txtNameFilter" placeholder="按文件名称筛选（回车或点击外部后生效）">
          <button class="search-clear" id="btnClearName" title="清空名称筛选">✕</button>
        </div>

        <div class="dropdown" id="ddFormat">
          <button class="btn" id="btnFormat"><span class="btn-label">格式</span> <span class="caret">&#9662;</span></button>
          <div class="drop-panel" id="panelFormat">
            <div class="dp-hd">按格式筛选<span class="clear-link" id="clearFmt">清除</span></div>
            <div class="fmt-list" id="fmtList"></div>
            <div class="dp-ft" id="fmtFt">已选 0 种格式</div>
          </div>

<script>

var wordPool = ['报告','照片','合同','发票','素材','截图','备份','测试','清单','资料','视频','音频','方案','会议纪要','项目计划','日志','配置','模板'];

function leafDirs(nodes, out){
  for (var i=0;i<nodes.length;i++){
    var n = nodes[i];
    if (n.children && n.children.length){ leafDirs(n.children, out); }
    else { out.push(n); }
  }
  return out;
}
(function prepare(nodes, parentPath){
  for (var i=0;i<nodes.length;i++){
    var n = nodes[i];
    n.full = parentPath ? joinPath(parentPath, n.name) : n.name;
    if (n.children && n.children.length) prepare(n.children, n.full);
  }
})(dirTree, null);

/* ================= 工具 ================= */
function $(id){ return document.getElementById(id); }
function fmtSize(bytes){
  if (bytes < 1024) return '1 KB';
  var kb = bytes/1024;
  if (kb < 1024) return Math.max(1, Math.round(kb)).toLocaleString() + ' KB';
  var mb = kb/1024;
  if (mb < 1024) return (Math.round(mb*10)/10).toLocaleString() + ' MB';
  return (Math.round(mb/1024*10)/10).toLocaleString() + ' GB';
}

  var d = new Date(), p = function(x){ return (x<10?'0':'')+x; };

});
function startScan(){
  if (scanning) return;
  var folder = $('txtFolder').value.trim();
  if (demoMode && !folder){
    $('txtFolder').value = 'D:\\演示目录';

  }
  if (!folder){ toast('请选择有效的目标文件夹。', 'err'); return; }
  if (!demoMode && $('chkExport').checked && !$('txtExportPath').value.trim()){
    toast('请设置导出位置，或取消勾选「导出 xlsx」。', 'err');
    return;
  }
  if (defaultNamePattern.test($('txtFileName').value.trim())){
    $('txtFileName').value = defaultExportName();
  }
  scanning = true;
  $('btnStart').disabled = true;
  setTabDisabled(true);
  $('scanDone').style.display = 'none';
  $('progFill').style.width = '0%';
  $('progPct').textContent = '0%';

  $('scanFileCount').textContent = '已发现 0 个文件';
  startDotTimer();
  lastExportPath = $('txtExportPath').value.trim();
  lastExportFileName = $('txtFileName').value.trim();
  if (!lastExportFileName) lastExportFileName = '文件名导出_' + stamp() + '.xlsx';
  if (demoMode){ simulateScan(); return; }
  postToHost('scan.start', {
    folder: folder,

function simulateScan(){
  setTimeout(function(){
    stopDotTimer();
    var files = allData.map(function(f){ return { name:f.name, extension:f.ext, fullPath:f.path, size:f.size }; });

    var t = setInterval(function(){
      pct += 0.6 + Math.random()*1.2;
      if (pct >= 100){
        clearInterval(t);
        handleScanDone({ files: files, exportRequested: $('chkExport').checked, elapsedMs: 0 });
        return;

      $('progFill').style.width = pct + '%';
      $('progPct').textContent = Math.floor(pct) + '%';
      var idx = Math.floor(pct/100*files.length);
      var f = files[idx % files.length];
      $('scanStatus').textContent = f.fullPath;
      $('scanFileCount').textContent = '已发现 ' + idx.toLocaleString() + ' 个文件';

function handleScanProgress(p){

    return { name: baseName, ext:f.extension||f.ext||'', path:f.fullPath||f.path||'', size:f.size||0, checked:false };

  rebuildIndex();

/* ================= 树状路径（从结果构建） ================= */
var tree = [];
function buildTreeFromFiles(files, baseDir){
  var base = (baseDir || '').replace(/\\+$/,'');
  var baseLower = base.toLowerCase();
  var rootName = base ? base.split('\\').pop() : '';
  var root = { name: rootName, full: base, children:[], count:0, checked:false, indeterminate:false, parent:null };
  var map = { '': root };
  files.forEach(function(f){
    var idx = f.path.lastIndexOf('\\');
    var dir = idx >= 0 ? f.path.substring(0, idx) : '';
    var rel = dir;
    if (base){
      var dl = dir.toLowerCase();
      if (dl === baseLower) rel = '';
      else if (dl.indexOf(baseLower + '\\') === 0) rel = dir.substring(base.length + 1);
    }
    if (!map[rel]){
      var parts = rel ? rel.split('\\') : [];
      var cur = '';
      var parent = root;
      for (var k=0;k<parts.length;k++){
        cur = cur ? cur + '\\' + parts[k] : parts[k];
        if (!map[cur]){
          var isAbs = /^[a-zA-Z]:/.test(cur);
          var full = isAbs ? cur : (cur ? base + '\\' + cur : base);
          var nn = { name: parts[k], full: full, children: [], count: 0, checked: false, indeterminate: false, parent: parent };
          parent.children.push(nn);
          map[cur] = nn;
        }
        parent = map[cur];
      }
    }
    map[rel].count++;
  });
  function post(node){
    var s = node.count;
    for (var i=0;i<node.children.length;i++) s += post(node.children[i]);
    node.totalCount = s;
    return s;
  }
  post(root);
  (function sortC(ns){
    ns.sort(function(x,y){ return x.name.toLowerCase() < y.name.toLowerCase() ? -1 : 1; });
    for (var i=0;i<ns.length;i++) sortC(ns[i].children);
  })(root.children);
  return base ? [root] : root.children;
}
function checkedNodes(nodes, acc){
  for (var i=0;i<nodes.length;i++){
    var n = nodes[i];
    if (n.checked) acc.push(n);
    checkedNodes(n.children, acc);
  }
  return acc;
}
function setSubChecked(node, v){
  node.checked = v;
  node.indeterminate = false;
  for (var i=0;i<node.children.length;i++) setSubChecked(node.children[i], v);
}
function refreshAncestors(node){
  var p = node.parent;
  while (p){
    var arr = p.children;
    var checked = 0, all = arr.length;
    for (var i=0;i<all;i++){ if (arr[i].checked || arr[i].indeterminate) checked++; }
    p.checked = checked===all;
    p.indeterminate = !p.checked && checked>0;
    p = p.parent;
  }
}
function renderTree(){
  var box = $('treeBox');
  box.innerHTML = '';
  var kw = $('txtTreeSearch').value.trim().toLowerCase();
  var selCount = checkedNodes(tree, []).length;
  $('pathFt').textContent = '已选 ' + selCount + ' 个文件夹';
  (function walk(nodes, depth){
    for (var i=0;i<nodes.length;i++){
      var n = nodes[i];
      var hasMatch = kw==='' || n.name.toLowerCase().indexOf(kw)>=0;
      var childHasMatch = false;
      (function w2(xs){
        for (var j=0;j<xs.length;j++){
          if (xs[j].name.toLowerCase().indexOf(kw)>=0){ childHasMatch = true; return; }
          w2(xs[j].children);
        }
      })(n.children);
      if (kw!=='' && !hasMatch && !childHasMatch) continue;
      var row = document.createElement('div');
      row.className = 'tree-node';
      row.style.paddingLeft = (10 + depth*18) + 'px';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = n.checked;
      cb.indeterminate = n.indeterminate;
      cb.__node = n;
      (function(node, check){
        check.addEventListener('change', function(){
          setSubChecked(node, check.checked);
          refreshAncestors(node);
          applyFilters();
          syncTreeChecks();
        });
        row.addEventListener('click', function(e){
          if (e.target !== check){ check.click(); }
        });
      })(n, cb);
      var ico = document.createElement('span');
      ico.className = 'folder-ico';
      ico.textContent = n.children.length ? '\uD83D\uDCC1' : '\uD83D\uDCC2';
      var nmel = document.createElement('span');
      nmel.className = 'nm';
      nmel.textContent = n.name;
      nmel.title = n.full;
      var cnt = document.createElement('span');
      cnt.className = 'cnt';
      cnt.textContent = n.totalCount.toLocaleString() + ' 个';
      row.appendChild(cb); row.appendChild(ico); row.appendChild(nmel); row.appendChild(cnt);
      box.appendChild(row);
      walk(n.children, depth+1);
    }
  })(tree, 0);
}
function syncTreeChecks(){
  var selCount = checkedNodes(tree, []).length;
  $('pathFt').textContent = '已选 ' + selCount + ' 个文件夹';
  var inputs = $('treeBox').querySelectorAll('input[type=checkbox]');
  for (var i=0;i<inputs.length;i++){
    var cb = inputs[i];
    if (cb.__node){
      cb.checked = cb.__node.checked;
      cb.indeterminate = cb.__node.indeterminate;
    }
  }
}
$('txtTreeSearch').addEventListener('input', renderTree);
$('clearPath').addEventListener('click', function(){
  (function clear(ns){ for (var i=0;i<ns.length;i++){ var n=ns[i]; n.checked=false; n.indeterminate=false; clear(n.children); } })(tree);
  applyFilters(); renderTree();
});
function pathMatch(f){
  var sel = checkedNodes(tree, []);
  if (!sel.length) return true;
  var p = f.path.toLowerCase();
  for (var i=0;i<sel.length;i++){
    if (p.indexOf(sel[i].full.toLowerCase())===0) return true;
  }
  return false;
}

/* ================= 格式多选 ================= */
function renderFmt(){
  var list = $('fmtList');
  list.innerHTML = '';
  extList.forEach(function(ext){
    var item = document.createElement('label');
    item.className = 'fmt-item';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = state.formats.has(ext);
    cb.addEventListener('change', function(){
      if (cb.checked) state.formats.add(ext); else state.formats.delete(ext);
      applyFilters(); renderFmt();
    });
    var nm = document.createElement('span'); nm.textContent = ext || '无扩展名';
    var cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = (extCounts[ext]||0).toLocaleString();
    item.appendChild(cb); item.appendChild(nm); item.appendChild(cnt);
    list.appendChild(item);
  });
  $('fmtFt').textContent = '已选 ' + state.formats.size + ' 种格式';
}
$('clearFmt').addEventListener('click', function(){ state.formats.clear(); applyFilters(); renderFmt(); });
function formatMatch(f){ return state.formats.size===0 || state.formats.has(f.ext); }

/* ================= 大小档位 ================= */
function renderTiers(){
  var list = $('tierList');
  list.innerHTML = '';
  sizeTiers.forEach(function(tier, idx){
    var item = document.createElement('label');
    item.className = 'tier-item';
    var radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = 'tier';
    radio.checked = state.sizeIdx===idx;
    radio.addEventListener('change', function(){ if (radio.checked){ state.sizeIdx = idx; applyFilters(); renderTiers(); } });
    item.appendChild(radio);
    item.appendChild(document.createTextNode(tier.label));
    list.appendChild(item);
  });
}
function sizeMatch(f){
  var t = sizeTiers[state.sizeIdx];
  return f.size >= t.min && f.size < t.max;
}

/* ================= 名称搜索（回车/失焦触发） ================= */
var nameInput = $('txtNameFilter');
function applyNameFilter(){
  state.name = nameInput.value.trim().toLowerCase();
  applyFilters();
}
nameInput.addEventListener('keydown', function(e){ if (e.key==='Enter'){ e.preventDefault(); applyNameFilter(); toast('名称筛选已应用','ok'); } });
nameInput.addEventListener('blur', function(){ applyNameFilter(); });
nameInput.addEventListener('input', function(){ $('btnClearName').style.display = nameInput.value ? 'block' : 'none'; });
$('btnClearName').addEventListener('click', function(){
  nameInput.value = '';
  state.name = '';
  $('btnClearName').style.display = 'none';
  applyFilters();
  toast('已清空名称筛选', 'ok');
});
function nameMatch(f){ return state.name==='' || f.name.toLowerCase().indexOf(state.name)>=0; }

/* ================= 组合筛选与排序 ================= */
var visible = [];
function updateFilterButtons(){
  var fmtLabel = '格式' + (state.formats.size ? ' (' + state.formats.size + ')' : '');
  var fBtn = $('btnFormat').querySelector('.btn-label');
  if (fBtn){ fBtn.textContent = fmtLabel; }
  $('btnFormat').classList.toggle('has-filter', state.formats.size > 0);

  var pathSel = checkedNodes(tree, []).length;
  var pBtn = $('btnPath').querySelector('.btn-label');
  if (pBtn){ pBtn.textContent = '路径' + (pathSel ? ' (' + pathSel + ')' : ''); }
  $('btnPath').classList.toggle('has-filter', pathSel > 0);

  var tier = sizeTiers[state.sizeIdx];
  var sBtn = $('btnSize').querySelector('.btn-label');
  if (sBtn){ sBtn.textContent = '大小' + (state.sizeIdx > 0 ? '：' + tier.label : ''); }
  $('btnSize').classList.toggle('has-filter', state.sizeIdx > 0);
}
function applyFilters(){
  visible = allData.filter(function(f){ return nameMatch(f) && formatMatch(f) && sizeMatch(f) && pathMatch(f); });
  updateFilterButtons();
  applySort();
  $('ftTotal').textContent = allData.length.toLocaleString();
  $('ftFiltered').textContent = visible.length.toLocaleString();
  $('emptyState').style.display = visible.length ? 'none' : 'block';
  $('chkAll').checked = false;
  $('chkAll').indeterminate = false;
  updateSelectedCount();
  renderSortIcons();
  renderRows();
}
function applySort(){
  var k = state.sortKey, d = state.sortDir;
  visible.sort(function(a,b){
    var r;
    if (k === 'size'){ r = a.size - b.size; }
    else {
      var av = (k === 'name' ? a.name : k === 'ext' ? a.ext : a.path).toLowerCase();
      var bv = (k === 'name' ? b.name : k === 'ext' ? b.ext : b.path).toLowerCase();
      r = av < bv ? -1 : av > bv ? 1 : 0;
    }
    return d === 'asc' ? r : -r;
  });
}
function renderSortIcons(){
  var map = { name:'sortName', ext:'sortExt', path:'sortPath', size:'sortSize' };
  ['name','ext','path','size'].forEach(function(k){
    var el = $(map[k]);
    if (el){
      if (state.sortKey === k){
        el.textContent = state.sortDir === 'asc' ? '▲' : '▼';
        el.classList.add('on');
      } else {
        el.textContent = '↕';
        el.classList.remove('on');
      }
    }
  });
}
$('btnClearAll').addEventListener('click', function(){
  state.name=''; state.formats.clear(); state.sizeIdx=0;
  $('txtNameFilter').value='';
  $('txtTreeSearch').value='';
  (function clear(ns){ for (var i=0;i<ns.length;i++){ var n=ns[i]; n.checked=false; n.indeterminate=false; clear(n.children); } })(tree);
  applyFilters(); renderFmt(); renderTiers(); renderTree();
  toast('已清除全部筛选','ok');
});

/* ================= 表头排序 ================= */
document.querySelectorAll('.col-sortable').forEach(function(h){
  h.addEventListener('click', function(){
    var key = h.dataset.key;
    if (state.sortKey === key){ state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc'; }
    else { state.sortKey = key; state.sortDir = 'asc'; }
    applyFilters();
  });
});

/* ================= 虚拟滚动 ================= */
var ROW = 34, OVERSCAN = 20;
var vlist = $('vlist'), vRows = $('vRows'), vSpacer = $('vSpacer');
function renderRows(){
  if (document.querySelector('.panel.active').id !== 'panel-result') return;
  var st = vlist.scrollTop, vh = vlist.clientHeight;
  var start = Math.max(0, Math.floor(st/ROW) - OVERSCAN);
  var end = Math.min(visible.length, Math.ceil((st+vh)/ROW) + OVERSCAN);
  vSpacer.style.height = (visible.length*ROW) + 'px';
  vRows.innerHTML = '';
  var frag = document.createDocumentFragment();
  for (var i=start;i<end;i++){
    var f = visible[i];
    var row = document.createElement('div');
    row.className = 'grid-row' + (f.checked ? ' selected-row' : '');
    row.style.transform = 'translateY(' + (i*ROW) + 'px)';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = f.checked;
    cb.addEventListener('change', (function(f, c, row){
      return function(){ f.checked = c.checked; row.classList.toggle('selected-row', f.checked); updateSelectedCount(); };
    })(f, cb, row));
    var c1 = document.createElement('span'); c1.className='col-check'; c1.appendChild(cb);
    var c2 = document.createElement('span'); c2.className='cell name'; c2.textContent = f.name; c2.title = f.name + f.ext;
    var c3 = document.createElement('span'); c3.className='cell ext'; c3.textContent = f.ext || '无扩展名';
    var c4 = document.createElement('span'); c4.className='cell path'; c4.textContent = f.path; c4.title = '点击在资源管理器中打开并选中';
    c4.addEventListener('click', (function(p){ return function(){
      if (demoMode){ toast('（预览）将在资源管理器中打开并选中：' + p, 'ok'); return; }
      postToHost('explorer.select', { path: p });
    }; })(f.path));
    var c5 = document.createElement('span'); c5.className='cell size'; c5.textContent = fmtSize(f.size);
    row.appendChild(c1); row.appendChild(c2); row.appendChild(c3); row.appendChild(c4); row.appendChild(c5);
    frag.appendChild(row);
  }
  vRows.appendChild(frag);
}
vlist.addEventListener('scroll', function(){ renderRows(); });

$('chkAll').addEventListener('change', function(){
  var want = this.checked;
  for (var i=0;i<visible.length;i++) visible[i].checked = want;
  updateSelectedCount();
  renderRows();
});
function updateSelectedCount(){
  var sel = 0;
  for (var i=0;i<allData.length;i++) if (allData[i].checked) sel++;
  $('ftSelected').textContent = '已勾选 ' + sel.toLocaleString() + ' 个';
  var visSel = 0;
  for (var j=0;j<visible.length;j++) if (visible[j].checked) visSel++;
  var chkAll = $('chkAll');
  if (visible.length===0){ chkAll.checked=false; chkAll.indeterminate=false; }
  else if (visSel===visible.length){ chkAll.checked=true; chkAll.indeterminate=false; }
  else if (visSel===0){ chkAll.checked=false; chkAll.indeterminate=false; }
  else { chkAll.checked=false; chkAll.indeterminate=true; }
}

/* ================= 下拉面板开合 ================= */
function bindDropdown(btnId, panelId){
  var btn = $(btnId), panel = $(panelId);
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    var isOpen = panel.classList.contains('open');
    document.querySelectorAll('.drop-panel.open').forEach(function(p){ p.classList.remove('open'); });
    document.querySelectorAll('.dropdown .btn.active').forEach(function(b){ b.classList.remove('active'); });
    if (!isOpen){ panel.classList.add('open'); btn.classList.add('active'); }
  });
}
bindDropdown('btnFormat','panelFormat');
bindDropdown('btnPath','panelPath');
bindDropdown('btnSize','panelSize');
document.querySelectorAll('.drop-panel').forEach(function(p){
  p.addEventListener('click', function(e){ e.stopPropagation(); });
});
document.addEventListener('click', function(e){
  var insideDropdown = false;
  var el = e.target;
  while (el && el !== document){
    if (el.classList && el.classList.contains('dropdown')){ insideDropdown = true; break; }
    el = el.parentNode;
  }
  if (!insideDropdown){
    document.querySelectorAll('.drop-panel.open').forEach(function(p){ p.classList.remove('open'); });
    document.querySelectorAll('.dropdown .btn.active').forEach(function(b){ b.classList.remove('active'); });
  }
});

/* ================= 批量操作 ================= */
function getSelected(){
  return allData.filter(function(f){ return f.checked; });
}

// ---- 移动 ----
$('btnMove').addEventListener('click', function(){
  var sel = getSelected();
  if (!sel.length){ toast('请先勾选要移动的文件','warn'); return; }
  browseFolder(function(target){
    if (!target) return;

function closeModal(id){ $(id).classList.remove('open'); }
$('btnMoveCancel').addEventListener('click', function(){ closeModal('modalMove'); });
$('btnMoveOk').addEventListener('click', function(){

});

// ---- 批量改名 ----
var rnInputs = ['rnPrefix','rnSuffix','rnFind','rnReplace','rnSeqStart','rnSeqWidth','rnSeqPos'];
rnInputs.forEach(function(id){
  $(id).addEventListener('input', updateRenamePreview);
  $(id).addEventListener('change', updateRenamePreview);
});
$('rnSeqEnable').addEventListener('change', function(){
  var on = this.checked;
  ['rnSeqStart','rnSeqWidth','rnSeqPos'].forEach(function(id){ $(id).disabled = !on; });
  updateRenamePreview();
});
$('btnRename').addEventListener('click', function(){
  var sel = getSelected();
  if (!sel.length){ toast('请先勾选要重命名的文件','warn'); return; }
  $('modalRename').classList.add('open');
  updateRenamePreview();
});
$('btnRenameCancel').addEventListener('click', function(){ closeModal('modalRename'); });
$('btnRenameOk').addEventListener('click', function(){
  var sel = getSelected();
  var items = computeRenameItems(sel);
  lastOp = { op:'rename', items: items };
  closeModal('modalRename');
  if (demoMode){ toast('（预览）将按规则重命名 ' + sel.length + ' 个文件', 'ok'); return; }
  postToHost('file.rename', { items: items });
});
function computeRenameItems(sel){
  var seq = $('rnSeqEnable').checked;
  var start = parseInt($('rnSeqStart').value||'1', 10);
  var width = Math.max(1, parseInt($('rnSeqWidth').value||'3', 10));
  var pos = $('rnSeqPos').value;
  var find = $('rnFind').value, rep = $('rnReplace').value, pre = $('rnPrefix').value, suf = $('rnSuffix').value;
  var items = [];
  sel.forEach(function(f, idx){
    var base = f.name; // name 已是不含扩展名的基名
    var r = find ? base.split(find).join(rep) : base;
    r = pre + r + suf;
    if (seq){
      var seqStr = String(start + idx);
      while (seqStr.length < width) seqStr = '0' + seqStr;
      r = (pos === 'prefix') ? seqStr + r : r + seqStr;
    }
    items.push({ path: f.path, newName: r + f.ext });
  });
  return items;
}
function updateRenamePreview(){
  if (!$('modalRename').classList.contains('open')) return;
  var sel = getSelected();
  var items = computeRenameItems(sel);
  var conflicts = 0;
  items.forEach(function(it, i){
    var dir = it.path.substring(0, it.path.lastIndexOf('\\'));
    var conflict = false;
    for (var j=0;j<allData.length;j++){
      var o = allData[j];
      if (o === sel[i]) continue;
      if (o.path.toLowerCase() === (dir + '\\' + it.newName).toLowerCase()){ conflict = true; break; }
    }
    if (conflict) conflicts++;
    it.conflict = conflict;
  });
  var html = '';
  var shown = items.slice(0, 10);
  shown.forEach(function(it){
    html += '<div class="row-item" style="' + (it.conflict ? 'color:#dc2626' : '') + '">' +
      escapeHtml(it.path.substring(it.path.lastIndexOf('\\')+1)) + ' \u2192 ' + escapeHtml(it.newName) +
      (it.conflict ? '（重名）' : '') + '</div>';
  });
  if (items.length > 10) html += '<div class="row-item" style="color:#94a3b8">\u2026 等共 ' + items.length + ' 项</div>';
  $('rnPreview').innerHTML = html;
  $('rnConflictCount').textContent = conflicts
    ? ('有 ' + conflicts + ' 项目标重名，执行时将被跳过')
    : ('将重命名 ' + items.length + ' 个文件');
}

$('btnDelete').addEventListener('click', function(){

$('btnConfirmDelete').addEventListener('click', function(){

// ---- 操作结果 ----
function handleOperationDone(p){
  if (!p) return;
  var opNames = { move:'移动', rename:'改名', delete:'删除' };
  var failed = p.failed || [];
  var failedSet = {};
  failed.forEach(function(f){ failedSet[f.path] = true; });
  var msg = (opNames[p.op]||p.op) + '完成：成功 ' + p.succeeded + ' 个，跳过 ' + p.skipped + ' 个';
  if (failed.length) msg += '，失败 ' + failed.length + ' 个';
  toast(msg, failed.length ? 'warn' : 'ok');
  failed.slice(0,3).forEach(function(f){ toast('失败：' + f.path + '（' + f.reason + '）', 'err'); });

  if (p.op === 'move' || p.op === 'delete'){
    var srcPaths = (lastOp && lastOp.files) || [];
    var keep = [];
    for (var i=0;i<allData.length;i++){
      var f = allData[i];
      if (srcPaths.indexOf(f.path) >= 0 && !failedSet[f.path]) continue;
      f.checked = false;
      keep.push(f);
    }
    allData = keep;
  } else if (p.op === 'rename' && lastOp && lastOp.items){
    var itemMap = {};
    lastOp.items.forEach(function(it){ itemMap[it.path] = it.newName; });
    allData.forEach(function(f){
      if (itemMap[f.path] && !failedSet[f.path]){
        var dir = f.path.substring(0, f.path.lastIndexOf('\\'));
        var newFile = itemMap[f.path];
        var dot = newFile.lastIndexOf('.');
        f.name = dot > 0 ? newFile.substring(0, dot) : newFile;
        f.ext = dot > 0 ? newFile.substring(dot) : '';
        f.path = dir + '\\' + newFile;
        f.checked = false;
      }
    });
  }
  rebuildIndex();
  renderRows();
}
function rebuildIndex(){
  extCounts = {};
  allData.forEach(function(f){ extCounts[f.ext] = (extCounts[f.ext]||0)+1; });
  extList = Object.keys(extCounts).sort();
  tree = buildTreeFromFiles(allData, demoMode ? '' : $('txtFolder').value.trim());
  applyFilters(); renderFmt(); renderTiers(); renderTree();
}
